<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificado - Francisco Gaete</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #E2E2E6; /* Color de fondo gris claro idéntico al original */
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
        }
        .certificado-container {
            width: 100%;
            max-width: 800px; /* Evita que sea inmenso en PC */
            padding-top: 20px;
        }
        img {
            width: 100%;
            height: auto;
            display: block;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); /* Ligera sombra para que destaque */
        }
    </style>
</head>
<body>
    <div class="certificado-container">
        <!-- Reemplaza el src con el nombre exacto de tu imagen -->
        <img src="FranciscoG.jpg" alt="Certificado de Título Francisco Gaete">
    </div>
</body>
</html>
