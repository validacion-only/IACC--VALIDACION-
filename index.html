<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificado - Francisco Gaete</title>
    <style>
        /* Quitamos los márgenes para que ocupe toda la pantalla */
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            background-color: #f0f0f0;
        }
        /* Hacemos que el visor ocupe el 100% del espacio */
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
        }
    </style>
</head>
<body>
    <!-- Usamos el visor de Google Docs para forzar la lectura del PDF sin descargarlo -->
    <iframe src="https://docs.google.com/gview?url=https://validacion-only.github.io/FranciscoGaete.pdf&embedded=true" frameborder="0"></iframe>
</body>
</html>
